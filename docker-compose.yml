version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: waste2value-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-waste2value}
      MYSQL_USER: ${DB_USERNAME:-waste2value}
      MYSQL_PASSWORD: ${DB_PASSWORD:-waste2value_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waste2value-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waste2value-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-waste2value}
      DB_USERNAME: ${DB_USERNAME:-waste2value}
      DB_PASSWORD: ${DB_PASSWORD:-waste2value_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - waste2value-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waste2value-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - waste2value-network

volumes:
  mysql_data:
  uploads_data:

networks:
  waste2value-network:
    driver: bridge
